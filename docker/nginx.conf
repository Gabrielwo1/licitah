server {
    listen 80 default_server;
    server_name _;
    root /var/www/html;

    # Entry point is start.php (defined in .htaccess DirectoryIndex)
    index start.php index.php;

    # Manifest / service worker rewrites
    location = /manifest.json      { rewrite ^ /admin/manifest.php last; }
    location = /app.webmanifest    { rewrite ^ /admin/manifest.php last; }
    location ~ ^/service-worker\.js { rewrite ^ /admin/service-worker.php last; }
    location ~ ^/sw\.js            { rewrite ^ /admin/service-worker.php last; }

    # API routes
    location ~ ^/api(/.*)?$        { rewrite ^/api(/.*)?$ /conteudo/modulos/apis/admins/request/api.php$1 last; }
    location ~ ^/auth(/.*)?$       { rewrite ^/auth(/.*)?$ /conteudo/modulos/apis/admins/request/auth.php$1 last; }
    location ~ ^/isNown(/.*)?$     { rewrite ^/isNown(/.*)?$ /admin/isNown.php$1 last; }
    location ~ ^/request(/.*)?$    { rewrite ^/request(/.*)?$ /admin/request.php$1 last; }
    location ~ ^/mensagem(/.*)?$   { rewrite ^/mensagem(/.*)?$ /admin/mensagem.php$1 last; }
    location ~ ^/cron(/.*)?$       { rewrite ^/cron(/.*)?$ /admin/cron.php$1 last; }
    location ~ ^/upload(/.*)?$     { rewrite ^/upload(/.*)?$ /admin/processador.php$1 last; }

    # Block setup.json
    location = /conteudo/setup.json { return 404; }

    # Deny hidden files
    location ~ /\. { deny all; }

    # Main location: serve file/dir or fallback to start.php
    location / {
        try_files $uri $uri/ /start.php?p=$uri&$query_string;
    }

    # PHP-FPM handler
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index start.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    client_max_body_size 64M;
}
